# Retrieval expansion: align retrieval eval population with V2 patching population.
# Adds 9 repos from SWE-bench Verified that are in the patching campaign
# but missing from the retrieval matrix.
#
# Run with: ./.venv/bin/python run_suite.py experiments_retrieval_expansion_v2.yaml
#
# Design decisions:
# - Uses SWE-bench Verified (same dataset as patching manifests)
# - n=10 per repo (first 10 from patching manifest), except seaborn (n=2, all available)
# - strict_commit_fidelity track (per-issue gold checkout)
# - 1 repeat (anchor repos Flask/Requests/Pytest already have 3 repeats in main matrix)
# - Methods: gm_progressive, rag_progressive, bm25 (the 3 that matter for cost story)

suite: retrieval-expansion-v2

description: >
  Expand retrieval evaluation to all 12 V2 patching repos.
  Eliminates the retrieval/patching population mismatch (STATE.md issue I1).
  Instance IDs drawn from the first 10 of each V2 Verified patching manifest.

defaults:
  manager_max_turns: 8
  rag_max_turns: 8
  repeats: 1
  redact_paths_in_issue_text: true
  seed: 17
  notes: retrieval-expansion-v2
  task_family: swe-bench
  dataset_name: SWE-bench/SWE-bench_Verified

experiments:
  # --- astropy (n=10 of 23 Verified) ---
  - repo: astropy/astropy
    domain: library
    source_prefixes: [astropy]
    n_issues: 10
    issue_set_id: issues_verified_astropy_v2_10
    instance_ids:
      - astropy__astropy-12907
      - astropy__astropy-13033
      - astropy__astropy-13236
      - astropy__astropy-13398
      - astropy__astropy-13453
      - astropy__astropy-13579
      - astropy__astropy-13977
      - astropy__astropy-14096
      - astropy__astropy-14182
      - astropy__astropy-14309
    evaluation_track: strict_commit_fidelity

  # --- django (n=10 of 232 Verified) ---
  - repo: django/django
    domain: web_framework
    source_prefixes: [django]
    n_issues: 10
    issue_set_id: issues_verified_django_v2_10
    instance_ids:
      - django__django-10097
      - django__django-10554
      - django__django-10880
      - django__django-10914
