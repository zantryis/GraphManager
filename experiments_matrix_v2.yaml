# Evaluation matrix V2: cross-benchmark, cross-domain, manifest-pinned.
# Run with: ./.venv/bin/python run_suite.py experiments_matrix_v2.yaml

suite: evaluation-matrix-v2

description: >
  Cross-benchmark retrieval matrix with strict and same-snapshot tracks.
  Each cell is manifest-pinned via explicit instance_ids, issue_set_id, and
  snapshot commit pins for amortized runs.

defaults:
  manager_max_turns: 4
  rag_max_turns: 4
  repeats: 3
  redact_paths_in_issue_text: true
  seed: 17
  notes: matrix-v2

experiments:
  # ===== SWE-bench =====
  # Web framework
  - repo: pallets/flask
    domain: web_framework
    task_family: swe-bench
    dataset_name: SWE-bench/SWE-bench
    source_prefixes: [src/flask]
    n_issues: 10
    issue_set_id: issues_swebench_flask_v2_10
    instance_ids:
      - pallets__flask-4045
      - pallets__flask-4074
      - pallets__flask-4160
      - pallets__flask-4169
      - pallets__flask-4544
      - pallets__flask-4575
      - pallets__flask-4642
      - pallets__flask-4935
      - pallets__flask-4992
      - pallets__flask-5014
    evaluation_track: strict_commit_fidelity

